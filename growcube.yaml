ota:
  - platform: esphome
    password: "1ASD"

substitutions:
  name: "growcube"
  friendly_name: "GrowCube"

  # If you want to name the soil moisture sensors more percisely in case the
  # watering channels water multiple plants, rename the entity in your Home
  # Automation Hub.
  channel_A_name: 'Salt'
  channel_B_name: 'Chives'
  channel_C_name: 'Tomatos'
  channel_D_name: 'Pineapple'

  # Calibrate min in dry soil.
  soil_moisture_calibration_A_min: '2.17 -> 0.00'
  # Calibrate max in 100% wet soil.
  soil_moisture_calibration_A_max: '4.96 -> 100.00'

  soil_moisture_calibration_B_min: '2.17 -> 0.00'
  soil_moisture_calibration_B_max: '4.96 -> 100.00'
  soil_moisture_calibration_C_min: '2.17 -> 0.00'
  soil_moisture_calibration_C_max: '4.96 -> 100.00'
  soil_moisture_calibration_D_min: '2.17 -> 0.00'
  soil_moisture_calibration_D_max: '4.96 -> 100.00'

wifi:
  ssid: "your wifi ssid"
  password: "your wifi password"

